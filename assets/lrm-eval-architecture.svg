<title id="title">LRM Eval Agent Infrastructure</title>
<desc id="desc">Datasets and synthesis supply tasks for evaluation with configurable harnesses, models and gateways. Harbor scores runs and publishes traces. OpenEnv supplies fresh rollouts for GRPO and multi-expert OPD, and updated models return to evaluation.</desc>
