<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1040" width="1800" height="1040" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">LRM Eval — Extensible Agent and Model Evaluation Infrastructure</title>
<desc id="fig-desc">Four pluggable areas: synthesis methods, agent harnesses, model gateways, and training backends. Benchmark and custom datasets feed three evaluation runners: Harbor, Direct, and VLMEvalKit. Unified evidence and traces feed a training feedback loop, with updated models evaluated on holdout and benchmark tasks.</desc>
